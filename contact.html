<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - BloomPetals</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="entrepreprise.html">entreprise</a>
            <a href="realisation.html">realisations</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>

    <main>
        <h1>Contactez-nous</h1>

        <p>
            Une question ou un projet floral ?
            Contactez notre équipe BloomPetals.
        </p>

        <form>
            <label for="civilite">civilité</label>
            <select name="civilite" id="civilite">
            <option value="monsieur">monsieur</option>
            <option value="madame">madame</option>
            <option value="autre">Autre</option>
            </select>
            <label for="nom">Nom</label>
            <input type="text" id="nom" name="nom">
            <label for="prenom">prenom</label>
            <input type="text" id="prenom" name="prenom">
            <label for="adresse">Adresse postale</label>
            <input type="text" id="adresse" name="adresse">
            <input type="checkbox" id="confidentialite" name="confidentialite">
            <label for="confidentialite">j'accepte la politique de confidentialité</label>
            <button type="submit">Envoyer</button>
        </form>

    </main>

      



</body>
</html>
